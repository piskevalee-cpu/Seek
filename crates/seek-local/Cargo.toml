[package]
name = "seek-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "SEEK local models: the llama.cpp supervisor"

[dependencies]
seek-core.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
shell-words = "1.1.1"
nix = { version = "0.31.3", features = ["signal", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { workspace = true, features = ["process", "io-util", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
