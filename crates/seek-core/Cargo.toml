reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
futures.workspace = true
nix = { version = "0.31.3", features = ["signal", "process"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tiktoken-rs = "0.12"
