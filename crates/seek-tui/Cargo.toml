[package]
name = "seek-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "SEEK terminal UI: model, update, view, components, theme"

[dependencies]
seek-core.workspace = true
seek-llm.workspace = true
seek-local.workspace = true
crossterm.workspace = true
ratatui.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
unicode-width = "0.2.3"
sysinfo = "0.40.1"

[features]
default = []
# The NVIDIA GPU, through the driver. The vitals degrade to a dash without it.
nvml = ["dep:nvml-wrapper"]

[dependencies.nvml-wrapper]
version = "0.13.0"
optional = true
