name: Release

# On a tag v*, the binaries for the four platforms are built and attached to the GitHub Release
# with the notes of the changelog (SPEC 2.6).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: The cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p seek
      - name: The archive
        run: |
          version="${GITHUB_REF_NAME}"
          staging="seek-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/seek" "$staging/seek"
          cp README.md LICENSE "$staging" 2>/dev/null || cp README.md "$staging"
          mkdir -p "$staging/assets"
          cp assets/logo.png "$staging/assets/"
          tar -czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: seek-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: The notes
        run: |
          {
            echo "## SEEK ${GITHUB_REF_NAME}"
            echo
            sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | sed '1d;$d'
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.tar.gz
          body_path: notes.md
          generate_release_notes: false
