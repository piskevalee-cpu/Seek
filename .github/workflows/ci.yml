name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Prompt budget
        run: cargo test -p seek-core --test prompt_budget

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Check the installer (syntax and dry run)
        shell: bash
        run: |
          sh -n install.sh
          sh install.sh --help | grep -q -- '--dry-run'
          sed -n 's/^    "\([^"]*\)".*/\1/p' crates/seek-tui/src/logo_bitmap.rs > /tmp/seek-logo-tui.txt
          sed -n "/<<'LOGO'/,/^LOGO$/p" install.sh | sed '1d;$d' > /tmp/seek-logo-install.txt
          diff /tmp/seek-logo-tui.txt /tmp/seek-logo-install.txt
          home="$(mktemp -d)"
          HOME="$home" SEEK_HOME="$home/seek" sh install.sh --dry-run
          test ! -e "$home/seek"
          rm -rf "$home"
