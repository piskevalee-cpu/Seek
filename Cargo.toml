[workspace]
resolver = "3"
members = [
    "crates/seek-core",
    "crates/seek-llm",
    "crates/seek-local",
    "crates/seek-tui",
    "crates/seek",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/piskevalee-cpu/Seek"
description = "SEEK: a thin, local-first coding-agent harness for the terminal"

[workspace.dependencies]
seek-core = { path = "crates/seek-core", version = "0.1.0" }
seek-llm = { path = "crates/seek-llm", version = "0.1.0" }
seek-local = { path = "crates/seek-local", version = "0.1.0" }
seek-tui = { path = "crates/seek-tui", version = "0.1.0" }

ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
toml = "1.2.1"
serde_norway = "0.9.42"
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# `panic` stays `unwind` on purpose: stopping the local llama.cpp server on exit
# relies on `Drop` running (SPEC 2.6).
